<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Instagram Non Followers</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; background:#0f172a; color:#e5e7eb; padding:20px }
    h2 { margin-bottom:5px }
    input, button { margin:10px 0 }
    button { padding:8px 14px; cursor:pointer }
    ul { list-style:none; padding:0 }
    li { padding:6px 0; border-bottom:1px solid #334155 }
    a { color:#38bdf8; text-decoration:none }
    .stats { margin:10px 0; color:#94a3b8 }
  </style>
</head>

<body>

<h2>Instagram Non-Followers Checker</h2>
<p class="stats">Offline • No login • Safe</p>

<label>followers_1.html</label><br>
<input type="file" id="followers"><br>

<label>following.html</label><br>
<input type="file" id="following"><br>

<button onclick="analyze()">Analyze</button>

<div class="stats" id="stats"></div>

<h3>❌ Not following you back</h3>
<ul id="result"></ul>

<script>
let followersHTML = "", followingHTML = "";

document.getElementById("followers").onchange = e => read(e, v => followersHTML = v);
document.getElementById("following").onchange = e => read(e, v => followingHTML = v);

function read(e, cb) {
  const r = new FileReader();
  r.onload = () => cb(r.result);
  r.readAsText(e.target.files[0]);
}

function extractUsernames(html) {
  const doc = new DOMParser().parseFromString(html, "text/html");

  return [...doc.querySelectorAll("a")]
    .map(a => a.textContent.trim())
    .filter(t =>
      t &&
      !t.includes("instagram") &&
      !t.includes("Follow") &&
      !t.includes("Requested")
    )
    .map(t => t.replace(/[^a-zA-Z0-9._]/g, ""));
}

function analyze() {
  if (!followersHTML || !followingHTML) {
    alert("Upload both files");
    return;
  }

  const followers = new Set(extractUsernames(followersHTML));
  const following = extractUsernames(followingHTML);

  const notBack = following.filter(u => !followers.has(u));

  document.getElementById("stats").innerHTML = `
    Followers: <b>${followers.size}</b><br>
    Following: <b>${following.length}</b><br>
    Not following back: <b style="color:#f87171">${notBack.length}</b>
  `;

  const ul = document.getElementById("result");
  ul.innerHTML = "";

  notBack.forEach(u => {
    const li = document.createElement("li");
    li.innerHTML = `<a href="https://instagram.com/${u}" target="_blank">${u}</a>`;
    ul.appendChild(li);
  });
}
</script>

</body>
</html>
