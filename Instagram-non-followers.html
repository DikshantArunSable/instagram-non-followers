<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Instagram Non-Followers Checker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --bg: #0f172a;
      --card: #020617;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --danger: #f87171;
      --success: #4ade80;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      margin-bottom: 6px;
    }

    p {
      color: var(--muted);
      margin-top: 0;
    }

    .card {
      background: var(--card);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    input[type="file"] {
      display: block;
      margin: 10px 0 20px;
      color: var(--text);
    }

    button {
      background: var(--accent);
      border: none;
      color: #000;
      padding: 12px 16px;
      font-size: 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover {
      opacity: 0.9;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .stat {
      background: #020617;
      padding: 14px;
      border-radius: 10px;
      font-size: 14px;
      color: var(--muted);
    }

    .stat b {
      display: block;
      font-size: 22px;
      margin-top: 4px;
      color: var(--text);
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .tab {
      padding: 8px 14px;
      border-radius: 20px;
      background: #020617;
      cursor: pointer;
      font-size: 14px;
      color: var(--muted);
    }

    .tab.active {
      background: var(--accent);
      color: #000;
      font-weight: 600;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid #1e293b;
    }

    li:last-child {
      border-bottom: none;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .open {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>

<div class="container">

  <h1>Instagram Followers Analyzer</h1>
  <p>Privacy-first • No login • Runs 100% in your browser</p>

  <div class="card">
    <label>Upload <b>followers_1.html</b></label>
    <input type="file" id="followersFile">

    <label>Upload <b>following.html</b></label>
    <input type="file" id="followingFile">

    <button onclick="analyze()">Analyze</button>

    <div class="stats" id="stats"></div>
  </div>

  <div class="card">
    <div class="tabs">
      <div class="tab active" onclick="showTab('notBack')" id="tab-notBack">❌ Not following back</div>
      <div class="tab" onclick="showTab('mutual')" id="tab-mutual">✅ Mutual followers</div>
    </div>

    <ul id="list"></ul>
  </div>

  <footer>
    Your data never leaves your device • Safe for GitHub Pages
  </footer>

</div>

<script>
let followersHTML, followingHTML;
let data = { notBack: [], mutual: [] };

document.getElementById('followersFile').onchange = e =>
  readFile(e.target.files[0], html => followersHTML = html);

document.getElementById('followingFile').onchange = e =>
  readFile(e.target.files[0], html => followingHTML = html);

function readFile(file, callback) {
  const reader = new FileReader();
  reader.onload = () => callback(reader.result);
  reader.readAsText(file);
}

function extractUsernames(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');

  return [...doc.querySelectorAll('a')]
    .map(a => a.getAttribute('href') || a.textContent)
    .map(v => v.trim())
    .filter(Boolean)
    .map(v => {
      if (v.startsWith('http')) {
        try {
          const u = new URL(v);
          return u.pathname.replace(/\//g, '').replace('_u', '');
        } catch {
          return null;
        }
      }
      return v.replace(/\//g, '');
    })
    .filter(Boolean);
}

function analyze() {
  if (!followersHTML || !followingHTML) {
    alert("Please upload both files");
    return;
  }

  const followers = new Set(extractUsernames(followersHTML));
  const following = new Set(extractUsernames(followingHTML));

  data.notBack = [...following].filter(u => !followers.has(u));
  data.mutual = [...following].filter(u => followers.has(u));

  document.getElementById('stats').innerHTML = `
    <div class="stat">Followers<b>${followers.size}</b></div>
    <div class="stat">Following<b>${following.size}</b></div>
    <div class="stat">Not following back<b style="color:var(--danger)">${data.notBack.length}</b></div>
    <div class="stat">Mutual followers<b style="color:var(--success)">${data.mutual.length}</b></div>
  `;

  showTab('notBack');
}

function showTab(type) {
  document.getElementById('tab-notBack').classList.remove('active');
  document.getElementById('tab-mutual').classList.remove('active');
  document.getElementById('tab-' + type).classList.add('active');

  const ul = document.getElementById('list');
  ul.innerHTML = "";

  data[type].forEach(user => {
    const li = document.createElement('li');
    li.innerHTML = `
      <a href="https://instagram.com/${user}" target="_blank">${user}</a>
      <button class="open" onclick="window.open('https://instagram.com/${user}','_blank')">Open</button>
    `;
    ul.appendChild(li);
  });
}
</script>

</body>
</html>
