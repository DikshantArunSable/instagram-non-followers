<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Instagram Non-Followers Checker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --bg: #0f172a;
      --card: #020617;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --danger: #f87171;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      margin-bottom: 6px;
    }

    p {
      color: var(--muted);
      margin-top: 0;
    }

    .card {
      background: var(--card);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    input[type="file"] {
      display: block;
      margin: 10px 0 20px;
      color: var(--text);
    }

    button {
      background: var(--accent);
      border: none;
      color: #000;
      padding: 12px 16px;
      font-size: 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover {
      opacity: 0.9;
    }

    .stats {
      display: flex;
      gap: 12px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .stat {
      background: #020617;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      color: var(--muted);
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid #1e293b;
    }

    li:last-child {
      border-bottom: none;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .open {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>

<div class="container">

  <h1>Instagram Non-Followers</h1>
  <p>Find who doesn’t follow you back — fully offline & safe.</p>

  <div class="card">
    <label>Upload <b>followers_1.html</b></label>
    <input type="file" id="followersFile">

    <label>Upload <b>following.html</b></label>
    <input type="file" id="followingFile">

    <button onclick="process()">Analyze</button>

    <div class="stats" id="stats"></div>
  </div>

  <div class="card">
    <h3>❌ Not following you back</h3>
    <ul id="result"></ul>
  </div>

  <footer>
    No login • No data stored • Runs fully in your browser
  </footer>

</div>

<script>
let followersHTML, followingHTML;

document.getElementById('followersFile').onchange = e =>
  readFile(e.target.files[0], data => followersHTML = data);

document.getElementById('followingFile').onchange = e =>
  readFile(e.target.files[0], data => followingHTML = data);

function readFile(file, callback) {
  const reader = new FileReader();
  reader.onload = () => callback(reader.result);
  reader.readAsText(file);
}

function extractUsernames(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  return [...doc.querySelectorAll('a')]
    .map(a => a.textContent.trim())
    .filter(Boolean);
}

function process() {
  if (!followersHTML || !followingHTML) {
    alert("Upload both files");
    return;
  }

  const followers = new Set(extractUsernames(followersHTML));
  const following = extractUsernames(followingHTML);

  const notFollowingBack = following.filter(
    u => !followers.has(u)
  );

  document.getElementById('stats').innerHTML = `
    <div class="stat">Followers: <b>${followers.size}</b></div>
    <div class="stat">Following: <b>${following.length}</b></div>
    <div class="stat">Not following back: <b>${notFollowingBack.length}</b></div>
  `;

  const ul = document.getElementById('result');
  ul.innerHTML = "";

  notFollowingBack.forEach(user => {
    const li = document.createElement('li');
    li.innerHTML = `
      <a href="https://instagram.com/${user}" target="_blank">${user}</a>
      <button class="open" onclick="window.open('https://instagram.com/${user}', '_blank')">
        Open
      </button>
    `;
    ul.appendChild(li);
  });
}
</script>

</body>
</html>
